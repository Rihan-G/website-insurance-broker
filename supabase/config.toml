[project]
id = "insurance-broker-app"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MB"

# Edge Function: AI key health (secrets AI_API_KEY_BROKER / AI_API_KEY_CLIENT — never expose via Vite)
[functions.ai-config]
verify_jwt = true

[functions.document-ingest]
verify_jwt = true
