<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("sb_theme");
          var dark;
          if (pref === "light") dark = false;
          else if (pref === "dark") dark = true;
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Sindicom Brokers Ltd — Insurance Broker &amp; Client Portal | Mauritius</title>
    <meta
      name="description"
      content="Licensed Mauritius insurance broker: motor, home, life, health, travel, and business cover. Free quotes, secure client portal, FSC licensed. Protect what matters most with Sindicom Brokers Ltd."
    />
    <meta name="theme-color" content="#0369A1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sindicom Brokers Ltd — Insurance Broker &amp; Client Portal" />
    <meta
      property="og:description"
      content="Fast, affordable insurance for individuals and businesses in Mauritius. Get a quote, upload documents, and work with FSC-licensed advisors."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sindicom Brokers Ltd — Insurance Broker Portal" />
    <meta
      name="twitter:description"
      content="Licensed Mauritius broker: quotes, secure portal, motor, home, life, health, travel, and business insurance."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "InsuranceAgency",
        "name": "Sindicom Brokers Ltd",
        "alternateName": "Sindicom",
        "url": "https://sindicombrokers.mu/",
        "email": "info@sindicombrokers.mu",
        "telephone": "+2301234567",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Port Louis",
          "addressCountry": "MU"
        },
        "areaServed": { "@type": "Country", "name": "Mauritius" }
      }
    </script>
  </head>
  <body class="min-h-screen bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
