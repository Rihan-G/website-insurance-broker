# Builds the Vite app and publishes to GitHub Pages (static hosting).
#
# One-time repo setup (owner must do in GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Live URL depends on the repository name:
#   • Project site (this repo): https://<owner>.github.io/website-insurance-broker/
#   • User/org site (repo named <owner>.github.io): https://<owner>.github.io/
#
# Open the URL that matches your repo. Visiting only https://<owner>.github.io/ when
# this app is published as a *project* site will show a different site or stale content.
#
# This workflow runs only on pushes to main — merge your PR before expecting updates.
#
# VITE_ALLOW_DEMO_LOGIN enables the same in-browser demo accounts as local dev
# (no real Supabase required to try the portal on Pages).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install

      - name: Set Vite base path for GitHub Pages
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            echo "VITE_GH_PAGES_BASE=/" >> "$GITHUB_ENV"
            echo "Using root base (user/org GitHub Pages repository)."
          else
            echo "VITE_GH_PAGES_BASE=/$REPO/" >> "$GITHUB_ENV"
            echo "Using project base /$REPO/ for GitHub Pages."
          fi

      - name: Build for GitHub Pages
        env:
          VITE_ALLOW_DEMO_LOGIN: "true"
        run: pnpm build

      - name: SPA fallback + Jekyll bypass
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
