# Builds the Vite app and publishes to GitHub Pages (static hosting).
#
# One-time repo setup (owner must do in GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Live URL (after first successful run):
#   https://<your-username>.github.io/<repository-name>/
#
# VITE_ALLOW_DEMO_LOGIN enables the same in-browser demo accounts as local dev
# (no real Supabase required to try the portal on Pages).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install

      - name: Build for GitHub Pages
        env:
          # Project Pages URL: https://<user>.github.io/<repo>/ — must match repository name (fork-friendly).
          VITE_GH_PAGES_BASE: /${{ github.event.repository.name }}
          VITE_ALLOW_DEMO_LOGIN: "true"
        run: pnpm build

      - name: SPA fallback + Jekyll bypass
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
